<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chuku Orders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* View-only order management. Shipments come live from the Whatnot Seller API through the chuku-orders
   Edge Function (the token never reaches the browser). Grouped by day, fewest different items first. */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --fg:#17202b; --muted:#5c6b7a; --line:#d3dae2; --line-strong:#aab5c1;
  --accent:#0d6b70; --accent-ink:#ffffff; --accent-soft:#dff0f0; --good:#1f7a46; --good-soft:#e3f3e8; --warn:#9a5b00; --warn-soft:#fff3dc; --bad:#b3261e; --bad-soft:#fde8e6;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121821; --panel:#1a222d; --fg:#e7ecf1; --muted:#97a5b4; --line:#2b3643; --line-strong:#43515f;
  --accent:#4fb6bb; --accent-ink:#0b1a1b; --accent-soft:#15353a; --good:#5fc48a; --good-soft:#15301f; --warn:#e3a84a; --warn-soft:#3a2d12; --bad:#f28b82; --bad-soft:#3d1c19; color-scheme:dark } }
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;padding-block:24px 48px;padding-inline:max(16px,calc(50% - 560px))}
h1{font-size:24px;font-weight:600;margin:0} h2{font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0} .muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .grow{flex:1 1 200px;min-width:0}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px} .nav a.on{background:var(--accent-soft);color:var(--accent)} .nav a:hover{color:var(--fg)}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);font:inherit;font-weight:500;padding:8px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 9px;font-size:13px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--fg);min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.tile:hover{border-color:var(--accent)} .tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums} .tile span{font-size:13px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.good b{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .chip small{opacity:.75;margin-left:4px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.grey{background:var(--bg);color:var(--muted)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;border-bottom:1px solid transparent}
.day[open] > summary{border-bottom-color:var(--line)} .day > summary::-webkit-details-marker{display:none}
.day > summary .d{font-weight:600;font-size:16px} .day > summary .c{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px} th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top} tr.ship:last-child td{border-bottom:0} tr.ship{cursor:pointer} tr.ship:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.ship.open td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent);border-bottom:0}
td.items{max-width:420px} .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .t.more{color:var(--muted);font-size:13px}
.n{display:inline-block;min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:6px;background:var(--bg);margin-right:6px}
.n.one{background:var(--good-soft);color:var(--good)} .n.unk{color:var(--muted);font-weight:400}
tr.detail td{background:color-mix(in srgb,var(--accent-soft) 25%,transparent);padding:4px 12px 14px 44px}
.det{display:grid;grid-template-columns:1fr auto;gap:12px 24px;font-size:14px} .det .order{border-left:3px solid var(--line-strong);padding-left:10px;margin-top:6px}
.det .it{display:flex;gap:10px;justify-content:space-between} .det .it .q{color:var(--muted);min-width:34px;display:inline-block}
.det .meta{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap} .det .meta div{margin-bottom:2px}
.ignored td:not(.actions){opacity:.55} .overdue .due{color:var(--bad);font-weight:600}
.msg{font-size:14px;min-height:1.4em} .err{color:var(--bad)} .prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden} .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* Print batch: pick boxes, make missing labels, combine into one PDF. */
.printbar{position:sticky;top:8px;z-index:5;border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.08)} .printbar[hidden]{display:none}
.printbar .count{font-weight:600} .printbar label.tog{gap:6px;cursor:pointer;user-select:none}
input[type=checkbox].pk{width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--accent);vertical-align:middle}
td.pick,th.pick{width:34px;padding-right:0} .day > summary .pk{margin-right:2px}
/* Checkpoint loader: one slim strip under the controls. Finished checkpoints collapse to ticks; it hides itself as soon as the load is done. */
.loader[hidden]{display:none} .loader{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--accent-soft) 40%,var(--panel))}
.loader .line{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-width:0} .loader .spin{margin-top:3px}
.loader .spin{flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.loader.error .spin{animation:none;border:0;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center} .loader.error .spin::before{content:"!"}
.loader .now{flex:1 1 auto;min-width:0} .loader .now b{font-weight:500} .loader.error .now{color:var(--bad)}
.loader .ticks{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .loader .ticks span{white-space:nowrap} .loader .ticks span::before{content:"✓ ";color:var(--good);font-weight:700}
.loader .clock{flex:0 0 auto;font-size:12px;color:var(--muted)}
.loader .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden} .loader .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){ .loader .ticks{display:none} }
.cards{display:none}
@media (max-width:760px){
  table{display:none} .cards{display:block}
  .card{padding:12px 14px;border-bottom:1px solid var(--line)} .card:last-child{border-bottom:0} .card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline} .card .top b{font-size:15px} .card .top .pk{margin-right:8px}
  .card .mid{margin:4px 0;color:var(--fg)} .card .bot{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
  .card .det{grid-template-columns:1fr;margin-top:8px} .card .det .meta{text-align:left;white-space:normal}
  .card.ignored{opacity:.6}
  .row .btn{flex:1 1 auto} .tile b{font-size:22px}
}
</style>
</head>
<body>
<div class="stack">
  <header class="row" data-chuku-app>
    <div class="grow"><h1>Order management</h1><p class="muted">Every box, live from Whatnot. View only.</p></div>
    <nav class="nav row"><a href="/tool/chuku/data/">Data</a><a href="/tool/chuku/keys/">Keys</a><a class="on" href="/tool/chuku/order-management/">Orders</a></nav>
    <div class="row"><span class="muted" id="whoEmail"></span><button class="btn" id="signOut">Sign out</button></div>
  </header>

  <main data-chuku-app class="stack">
    <section class="panel stack" style="gap:12px">
      <div class="row">
        <label class="row" style="gap:6px">Shop <select id="shop"></select></label>
        <div class="row" style="gap:6px"><span class="muted small">Dates</span>
          <button class="chip on" data-range="today">Today</button><button class="chip" data-range="yesterday">Yesterday</button><button class="chip" data-range="week">This week</button><button class="chip" data-range="month">This month</button><button class="chip" data-range="all">Last 30 days</button>
        </div>
        <div class="row" style="gap:6px"><input type="date" id="from" aria-label="From"><span class="muted">to</span><input type="date" id="to" aria-label="To"></div>
        <input type="search" id="q" placeholder="Search buyer, item, tracking" style="flex:1 1 180px">
        <button class="btn" id="reload">Refresh</button>
      </div>
      <div class="loader" id="loader" hidden>
        <div class="line"><span class="spin"></span><span class="now" id="ldNow"></span><span class="ticks" id="ldTicks"></span><span class="clock mono" id="ldClock">0s</span></div>
        <div class="bar" id="ldBar" hidden><i></i></div>
      </div>
      <div class="row"><span class="msg grow" id="msg"></span><span class="muted small" id="stamp"></span></div>
    </section>



    <section class="tiles" id="tiles"></section>

    <section class="panel printbar row" id="printbar" hidden>
      <span class="count" id="pkCount">0 picked</span>
      <button class="btn sm" id="pickAll">Pick all in view</button><button class="btn sm" id="pickNone">Clear</button>
      <label class="row tog small"><input type="checkbox" class="pk" id="withDropped"> Include dropped off</label>
      <span class="grow"></span>
      <button class="btn" id="makeLabels" disabled>Make labels</button>
      <button class="btn primary" id="buildPdf" disabled>Build PDF</button>
    </section>

    <section class="chips" id="chips"></section>

    <section class="stack" id="days"><div class="panel empty">Pick a shop.</div></section>
  </main>
</div>

<script src="/tool/chuku-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/tool/chuku/gate.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const sb = window.ChukuGate && window.ChukuGate.sb; if (!sb) return;
  const FN = window.CHUKU.url + '/functions/v1/chuku-orders';
  const TZ = 'America/Los_Angeles';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => c == null ? '' : '$' + (c / 100).toFixed(2);

  // ---- state ----
  let session = null, shops = [], shop = '', ignored = new Set();
  let ships = [];            // slimmed shipments from the function, with .contents once known
  let chip = 'all', range = 'today', from = '', to = '', q = '';
  const open = new Set();    // expanded shipment ids
  const picked = new Set();  // shipment ids ticked for printing
  let withDropped = false;   // print view: also show boxes already dropped off
  let contentsRun = 0;

  $('signOut').addEventListener('click', () => window.ChukuGate.signOut());

  // ---- dates in shop time ----
  const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });   // 2026-10-17
  const dayKey = iso => iso ? dayFmt.format(new Date(iso)) : 'unknown';
  const niceDay = key => { if (key === 'unknown') return 'No date'; const [y, m, d] = key.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d, 12)); return dt.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric', year: y === new Date().getFullYear() ? undefined : 'numeric' }); };
  const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const todayKey = () => dayKey(new Date().toISOString());
  const shiftKey = (key, days) => { const [y, m, d] = key.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10); };
  function rangeBounds() {
    const t = todayKey();
    if (range === 'today') return [t, t];
    if (range === 'yesterday') { const y = shiftKey(t, -1); return [y, y]; }
    if (range === 'week') { const dow = new Date(t + 'T12:00:00Z').getUTCDay(); return [shiftKey(t, -((dow + 6) % 7)), t]; }   // Monday start
    if (range === 'month') return [t.slice(0, 8) + '01', t];
    if (range === 'custom') return [from || '0000-00-00', to || '9999-99-99'];
    return [null, null];
  }

  // ---- classification ----
  const CANCEL = /^cancelled|^failed/;
  function kind(s) {
    if (CANCEL.test(s.status)) return 'cancelled';
    if (s.fulfillment === 'pickup') return s.status === 'delivered' ? 'picked_up' : 'pickup';
    if (s.status === 'created') return 'needs_label';
    if (s.status === 'label_generated') return 'labeled';
    if (s.status === 'dropped_off' || s.status === 'in_transit') return 'shipped';
    if (s.status === 'delivered') return 'delivered';
    return 'other';
  }
  const isOverdue = s => !!s.dropoff_due && ['needs_label', 'labeled'].includes(kind(s)) && new Date(s.dropoff_due).getTime() + 864e5 < Date.now();
  const isProblem = s => (s.required_actions && s.required_actions.length > 0) || s.status === 'cancelled_tracking_stuck' || s.status === 'failed';
  const isIgnored = s => !!s.buyer && ignored.has(s.buyer.toLowerCase());
  const STATUS_LABEL = { created: 'Needs label', label_generated: 'Labeled', dropped_off: 'Dropped off', in_transit: 'In transit', delivered: 'Delivered', failed: 'Failed', cancelled: 'Cancelled', cancelled_not_shipped: 'Cancelled, not shipped', cancelled_not_shipped_with_dropoff: 'Cancelled after drop-off', cancelled_tracking_stuck: 'Tracking stuck' };
  const STATUS_CLASS = { created: 'warn', label_generated: '', dropped_off: 'good', in_transit: 'good', delivered: 'grey', failed: 'bad', cancelled: 'grey', cancelled_not_shipped: 'grey', cancelled_not_shipped_with_dropoff: 'bad', cancelled_tracking_stuck: 'bad' };
  function statusPill(s) {
    if (s.fulfillment === 'pickup' && !CANCEL.test(s.status)) return `<span class="pill ${s.status === 'delivered' ? 'grey' : 'warn'}">${s.status === 'delivered' ? 'Picked up' : 'Pickup waiting'}</span>`;
    return `<span class="pill ${STATUS_CLASS[s.status] || ''}">${esc(STATUS_LABEL[s.status] || s.status)}</span>`;
  }

  // ---- filters ----
  // "To print" = everything the carrier has not scanned yet: needs label + labeled. Dropped off joins only when the toggle is on. Pickups never.
  const printable = s => s.fulfillment !== 'pickup' && !CANCEL.test(s.status) && (s.status === 'created' || s.status === 'label_generated' || (withDropped && s.status === 'dropped_off'));
  const CHIPS = [
    ['all', 'All', () => true],
    ['print', 'To print', printable],
    ['needs_label', 'Needs label', s => kind(s) === 'needs_label'],
    ['labeled', 'Labeled', s => kind(s) === 'labeled'],
    ['shipped', 'Shipped', s => kind(s) === 'shipped'],
    ['delivered', 'Delivered', s => kind(s) === 'delivered'],
    ['pickups', 'Pickups', s => s.fulfillment === 'pickup' && !CANCEL.test(s.status)],
    ['overdue', 'Overdue', isOverdue],
    ['problems', 'Problems', isProblem],
    ['cancelled', 'Cancelled', s => kind(s) === 'cancelled'],
    ['ignored', 'Ignored buyers', isIgnored],
  ];
  function inRange(s) { const [a, b] = rangeBounds(); if (!a) return true; const k = dayKey(s.created_at); return k >= a && k <= b; }
  function matchesQ(s) {
    if (!q) return true; const needle = q.toLowerCase();
    if ((s.buyer || '').toLowerCase().includes(needle) || (s.buyer_name || '').toLowerCase().includes(needle)) return true;
    if ((s.tracking || '').toLowerCase().includes(needle) || s.id.includes(needle)) return true;
    const c = s.contents; if (c) for (const o of c.orders) { if (o.id.includes(needle)) return true; for (const it of o.items) if (it.title.toLowerCase().includes(needle)) return true; }
    return false;
  }
  const visible = () => { const f = CHIPS.find(c => c[0] === chip)[2]; return ships.filter(s => inRange(s) && f(s) && matchesQ(s)); };

  // ---- sort inside a day: shipping before pickup, fewest different items first, then fewest units, then buyer ----
  const skuOf = s => s.contents ? s.contents.sku_count : 9999;
  const unitOf = s => s.contents ? s.contents.unit_count : 9999;
  function daySort(a, b) {
    const pa = a.fulfillment === 'pickup' ? 1 : 0, pb = b.fulfillment === 'pickup' ? 1 : 0; if (pa !== pb) return pa - pb;
    if (skuOf(a) !== skuOf(b)) return skuOf(a) - skuOf(b);
    if (unitOf(a) !== unitOf(b)) return unitOf(a) - unitOf(b);
    return (a.buyer || '').localeCompare(b.buyer || '');
  }

  // ---- render ----
  function renderTiles() {
    const inR = ships.filter(inRange);
    const defs = [
      ['print', 'To print', inR.filter(printable).length, 'warn'],
      ['needs_label', 'Needs label', inR.filter(s => kind(s) === 'needs_label').length, 'warn'],
      ['overdue', 'Overdue drop-off', inR.filter(isOverdue).length, 'bad'],
      ['labeled', 'Labeled, not dropped', inR.filter(s => kind(s) === 'labeled').length, ''],
      ['shipped', 'In transit', inR.filter(s => kind(s) === 'shipped').length, 'good'],
      ['pickups', 'Pickups waiting', inR.filter(s => kind(s) === 'pickup').length, 'warn'],
      ['all', 'All boxes', inR.length, ''],
    ];
    $('tiles').innerHTML = defs.map(([k, label, n, cls]) => `<button class="tile ${n ? cls : ''} ${chip === k ? 'on' : ''}" data-chip="${k}"><b>${n}</b><span>${label}</span></button>`).join('');
    const inRq = inR.filter(matchesQ);
    $('chips').innerHTML = CHIPS.map(([k, label, f]) => { const n = inRq.filter(f).length; return (k === 'all' || n || chip === k) ? `<button class="chip ${chip === k ? 'on' : ''}" data-chip="${k}">${label}<small>${n}</small></button>` : ''; }).join('');
  }

  const titlesOf = c => { const out = []; for (const o of c.orders) for (const it of o.items) out.push((it.qty > 1 ? it.qty + '× ' : '') + it.title); return out; };
  function itemsCell(s) {
    const c = s.contents;
    if (!c) return `<span class="n unk">…</span><span class="muted small">${s.unread ? 'not answered yet' : 'loading contents'}</span>`;
    const titles = titlesOf(c);
    const shown = titles.slice(0, 2).map(t => `<span class="t">${esc(t)}</span>`).join('');
    const more = titles.length > 2 ? `<span class="t more">+${titles.length - 2} more</span>` : '';
    return `<span class="n ${c.sku_count === 1 ? 'one' : ''}" title="different items">${c.sku_count}</span><span class="muted small">${c.unit_count} unit${c.unit_count === 1 ? '' : 's'}, ${c.orders.length} order${c.orders.length === 1 ? '' : 's'}</span>${shown}${more}`;
  }
  function detail(s) {
    const c = s.contents;
    const orders = !c ? '<p class="muted">Loading contents…</p>' : c.orders.map(o => `<div class="order"><div class="row small" style="gap:8px"><span class="mono">#${esc(o.id)}</span><span class="muted">${esc(o.type || '')}</span>${o.status && o.status !== 'completed' && o.status !== 'pending_fulfillment' ? `<span class="pill grey">${esc(o.status)}</span>` : ''}<span class="muted">${money(o.total_cents)}</span></div>${o.items.map(it => `<div class="it"><span><span class="q">${it.qty}×</span>${esc(it.title)}</span><span class="mono muted">${money(it.price_cents)}</span></div>`).join('')}</div>`).join('');
    const meta = [
      s.created_at ? `<div>Created ${esc(dayKey(s.created_at))} ${esc(timeFmt.format(new Date(s.created_at)))}</div>` : '',
      s.dropoff_due ? `<div class="${isOverdue(s) ? 'err' : ''}">Drop off by ${esc(dayKey(s.dropoff_due))}</div>` : '',
      s.carrier ? `<div>${esc(s.carrier)} ${esc(s.service || '')}</div>` : '',
      s.tracking ? `<div class="mono">${esc(s.tracking)}</div>` : '',
      s.weight ? `<div>${esc(s.weight)}${s.dims ? ', ' + esc(s.dims) : ''}</div>` : '',
      s.seller_cost_cents != null ? `<div>Seller shipping ${money(s.seller_cost_cents)}</div>` : '',
      s.required_actions && s.required_actions.length ? `<div class="err">${esc(s.required_actions.join(', ').replace(/_/g, ' '))}</div>` : '',
      `<div class="mono">shipment ${esc(s.id)}</div>`,
    ].join('');
    const canOpen = s.has_label || s.fulfillment === 'pickup';
    const actions = `<div class="row" style="margin-top:8px"><button class="btn sm" data-label="${esc(s.id)}" ${canOpen ? '' : 'disabled title="no label yet"'}>${s.fulfillment === 'pickup' ? 'Open pickup slip' : 'Open label PDF'}</button>${s.url ? `<a class="btn sm" href="${esc(s.url)}" target="_blank" rel="noopener">Open in Whatnot</a>` : ''}</div>`;
    return `<div class="det"><div>${orders}${actions}</div><div class="meta">${meta}</div></div>`;
  }
  function rowHtml(s) {
    const cls = ['ship', isIgnored(s) ? 'ignored' : '', isOverdue(s) ? 'overdue' : '', open.has(s.id) ? 'open' : ''].join(' ');
    const buyer = `<b>${esc(s.buyer || '—')}</b>${s.buyer_name && s.buyer_name !== s.buyer ? `<br><span class="muted small">${esc(s.buyer_name)}</span>` : ''}${isIgnored(s) ? ' <span class="pill grey">ignored</span>' : ''}`;
    const due = s.dropoff_due ? `<span class="due">${esc(dayKey(s.dropoff_due).slice(5))}</span>` : '';
    const track = s.tracking ? `<span class="mono small">${esc(s.carrier || '')} ${esc(s.tracking.slice(-8))}</span>` : '';
    const pk = chip === 'print' ? `<td class="pick"><input type="checkbox" class="pk" data-pick="${esc(s.id)}" ${picked.has(s.id) ? 'checked' : ''} aria-label="pick"></td>` : '';
    const main = `<tr class="${cls}" data-id="${esc(s.id)}">${pk}<td>${buyer}</td><td class="items">${itemsCell(s)}</td><td>${statusPill(s)}${isProblem(s) && !CANCEL.test(s.status) ? ' <span class="pill bad">action</span>' : ''}</td><td>${due}</td><td>${track}</td><td class="muted small mono">${s.created_at ? esc(timeFmt.format(new Date(s.created_at))) : ''}</td></tr>`;
    const det = open.has(s.id) ? `<tr class="detail"><td colspan="${chip === 'print' ? 7 : 6}">${detail(s)}</td></tr>` : '';
    return main + det;
  }
  function cardHtml(s) {
    const cls = ['card', isIgnored(s) ? 'ignored' : '', isOverdue(s) ? 'overdue' : ''].join(' ');
    const c = s.contents;
    const summary = c ? `<span class="n ${c.sku_count === 1 ? 'one' : ''}">${c.sku_count}</span>${c.unit_count} unit${c.unit_count === 1 ? '' : 's'}: ${esc(titlesOf(c).slice(0, 3).join(', '))}${titlesOf(c).length > 3 ? '…' : ''}` : `<span class="muted">${s.unread ? 'not answered yet' : 'loading contents…'}</span>`;
    const pk = chip === 'print' ? `<input type="checkbox" class="pk" data-pick="${esc(s.id)}" ${picked.has(s.id) ? 'checked' : ''} aria-label="pick">` : '';
    return `<div class="${cls}" data-id="${esc(s.id)}"><div class="top"><b>${pk}${esc(s.buyer || '—')}${isIgnored(s) ? ' <span class="pill grey">ignored</span>' : ''}</b>${statusPill(s)}</div><div class="mid small">${summary}</div><div class="bot">${s.dropoff_due ? `<span class="due">due ${esc(dayKey(s.dropoff_due).slice(5))}</span>` : ''}${s.tracking ? `<span class="mono">${esc(s.tracking.slice(-8))}</span>` : ''}<span>${s.created_at ? esc(timeFmt.format(new Date(s.created_at))) : ''}</span></div>${open.has(s.id) ? detail(s) : ''}</div>`;
  }
  function renderDays() {
    const vis = visible();
    if (!shop) { $('days').innerHTML = '<div class="panel empty">Pick a shop.</div>'; return; }
    if (!vis.length) { $('days').innerHTML = `<div class="panel empty">${ships.length ? 'No boxes match these dates and filters.' : 'No shipments loaded.'}</div>`; return; }
    const byDay = new Map();
    for (const s of vis) { const k = dayKey(s.created_at); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(s); }
    const keys = [...byDay.keys()].sort().reverse();
    const wasOpen = new Set([...document.querySelectorAll('details.day[open]')].map(d => d.dataset.day));
    const first = !document.querySelector('details.day');
    $('days').innerHTML = keys.map((k, i) => {
      const list = byDay.get(k).sort(daySort);
      const need = list.filter(s => kind(s) === 'needs_label').length, pk = list.filter(s => kind(s) === 'pickup').length, od = list.filter(isOverdue).length;
      const bits = [`${list.length} box${list.length === 1 ? '' : 'es'}`, need ? `<span class="err">${need} need label</span>` : '', od ? `<span class="err">${od} overdue</span>` : '', pk ? `${pk} pickup${pk === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ');
      const isOpen = first ? (i < 7 || keys.length <= 10) : wasOpen.has(k);
      const dayPk = chip === 'print' ? `<input type="checkbox" class="pk" data-pickday="${k}" ${list.every(s => picked.has(s.id)) ? 'checked' : ''} aria-label="pick whole day">` : '';
      return `<details class="day" ${isOpen ? 'open' : ''} data-day="${k}"><summary>${dayPk}<span class="d">${esc(niceDay(k))}</span><span class="c">${bits}</span></summary>
        <table><thead><tr>${chip === 'print' ? '<th class="pick"></th>' : ''}<th>Buyer</th><th>Contents</th><th>Status</th><th>Due</th><th>Tracking</th><th>Time</th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table>
        <div class="cards">${list.map(cardHtml).join('')}</div></details>`;
    }).join('');
  }
  const pickedShips = () => visible().filter(s => picked.has(s.id));
  function renderPrintBar() {
    const bar = $('printbar'); bar.hidden = chip !== 'print'; if (bar.hidden) return;
    const ps = pickedShips(), need = ps.filter(s => !s.has_label).length, ready = ps.length - need;
    $('pkCount').textContent = `${ps.length} picked` + (need ? ` · ${need} need a label` : '');
    $('withDropped').checked = withDropped;
    $('makeLabels').disabled = !need; $('makeLabels').textContent = need ? `Make ${need} label${need === 1 ? '' : 's'}` : 'Make labels';
    $('buildPdf').disabled = !ready; $('buildPdf').textContent = ready ? `Build PDF (${ready})` : 'Build PDF';
  }
  function render() { renderTiles(); renderDays(); renderPrintBar(); }

  // ---- events ----
  document.addEventListener('click', e => {
    const pk = e.target.closest('[data-pick]'); if (pk) { e.stopPropagation(); const id = pk.dataset.pick; if (picked.has(id)) picked.delete(id); else picked.add(id); renderDays(); renderPrintBar(); return; }
    const pd = e.target.closest('[data-pickday]'); if (pd) { e.stopPropagation(); const list = visible().filter(s => dayKey(s.created_at) === pd.dataset.pickday); const all = list.every(s => picked.has(s.id)); for (const s of list) { if (all) picked.delete(s.id); else picked.add(s.id); } renderDays(); renderPrintBar(); return; }
    const t = e.target.closest('[data-chip]'); if (t) { chip = t.dataset.chip; render(); pumpContents(); return; }
    const r = e.target.closest('[data-range]'); if (r) { range = r.dataset.range; from = to = ''; $('from').value = $('to').value = ''; document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('on', b === r)); render(); pumpContents(); return; }
    const lb = e.target.closest('[data-label]'); if (lb) { e.stopPropagation(); openLabel(lb.dataset.label, lb); return; }
    if (e.target.closest('a')) return;
    const row = e.target.closest('tr.ship, .card'); if (row && !e.target.closest('.det')) { const id = row.dataset.id; if (open.has(id)) open.delete(id); else open.add(id); renderDays(); }
  });
  const onDate = () => { from = $('from').value; to = $('to').value; range = (from || to) ? 'custom' : 'all'; document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('on', range === 'all' && b.dataset.range === 'all')); render(); pumpContents(); };
  $('from').addEventListener('change', onDate); $('to').addEventListener('change', onDate);
  $('q').addEventListener('input', () => { q = $('q').value.trim(); render(); });
  $('shop').addEventListener('change', () => { shop = $('shop').value; try { localStorage.setItem('chuku.om.shop', shop); } catch (_) {} load(); });
  $('reload').addEventListener('click', () => load());
  $('withDropped').addEventListener('change', () => { withDropped = $('withDropped').checked; render(); pumpContents(); });
  $('pickAll').addEventListener('click', () => { for (const s of visible()) picked.add(s.id); renderDays(); renderPrintBar(); });
  $('pickNone').addEventListener('click', () => { picked.clear(); renderDays(); renderPrintBar(); });
  $('makeLabels').addEventListener('click', () => makeLabels());
  $('buildPdf').addEventListener('click', () => buildPdf());

  // ---- data ----
  async function call(body) {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': window.CHUKU.key }, body: JSON.stringify({ shop, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  const say = (text, bad) => { $('msg').textContent = text; $('msg').className = 'msg grow' + (bad ? ' err' : ''); };
  // ---- loader strip: who / shops once, then two jobs (list, contents) that may run at the same time ----
  const ld = (() => {
    const LABEL = { who: 'Checking who you are', shops: 'Finding your shops', list: 'Asking Whatnot', contents: 'Reading what is in each box', labels: 'Making labels', pdf: 'Building the PDF' };
    const SHORT = { who: 'you', shops: 'shops', list: 'list', contents: 'contents', labels: 'labels', pdf: 'PDF' };
    const ORDER = ['who', 'shops', 'list', 'contents', 'labels', 'pdf'];
    let t0 = 0, clock = null; const active = new Map(); const done = new Set(); let failed = null;
    const tick = () => { $('ldClock').textContent = Math.round((Date.now() - t0) / 1000) + 's'; };
    const draw = () => {
      const parts = ORDER.filter(n => active.has(n)).map(n => `<b>${esc(LABEL[n])}</b>${active.get(n) ? ' · ' + esc(active.get(n)) : ''}`);
      $('ldNow').innerHTML = failed ? `<b>${esc(LABEL[failed.name])}</b> · ${esc(failed.text)}` : parts.join(' &nbsp;|&nbsp; ');
      $('ldTicks').innerHTML = ORDER.filter(n => done.has(n) && !active.has(n)).map(n => `<span>${SHORT[n]}</span>`).join('');
      const idle = !active.size && !failed;
      if (idle) { clearInterval(clock); clock = null; t0 = 0; $('loader').hidden = true; $('ldBar').hidden = true; }
      else { if (!t0) t0 = Date.now(); if (!clock) clock = setInterval(tick, 500); tick(); $('loader').hidden = false; $('loader').classList.toggle('error', !!failed); }
    };
    return {
      set(name, text) { failed = null; active.set(name, text || ''); draw(); },
      done(name) { active.delete(name); done.add(name); draw(); },
      clear(name) { active.delete(name); done.delete(name); draw(); },
      bar(frac) { if (frac == null) { $('ldBar').hidden = true; return; } $('ldBar').hidden = false; $('ldBar').firstElementChild.style.width = Math.round(frac * 100) + '%'; },
      fail(name, text) { active.delete(name); failed = { name, text: text || 'failed' }; draw(); },
    };
  })();
  const SINCE_DAYS = 30; let listRun = 0;
  async function load() {
    if (!shop) return;
    listRun++; const run = listRun; contentsRun++;
    ships = []; open.clear(); picked.clear(); render();
    say(''); $('reload').disabled = true; $('stamp').textContent = '';
    ld.clear('list'); ld.clear('contents'); ld.set('list', `@${shop} · last ${SINCE_DAYS} days`);
    const since = new Date(Date.now() - SINCE_DAYS * 864e5).toISOString();
    let cursor = null, chunks = 0, oldest = null, pagesTotal = 0;
    try {
      do {
        const j = await call({ action: 'list', since, cursor, max_pages: 4 });
        if (run !== listRun) return;
        ignored = new Set((j.ignored_buyers || []).map(x => x.toLowerCase()));
        for (const s of j.shipments || []) if (new Date(s.created_at || 0).getTime() >= Date.parse(since) - 864e5) ships.push(s);
        cursor = j.next_cursor || null; chunks++; pagesTotal += j.pages || 0; oldest = ships.reduce((m, s) => (s.created_at && (!m || s.created_at < m)) ? s.created_at : m, null);
        $('stamp').textContent = `${ships.length} boxes${oldest ? ' back to ' + niceDay(dayKey(oldest)) : ''} · Whatnot answered ${new Date(j.fetched_at).toLocaleTimeString()}`;
        ld.set('list', `${ships.length} boxes so far${oldest ? ', back to ' + niceDay(dayKey(oldest)) : ''}`);
        render();
        pumpContents();
        if (chunks >= 25) { say(`Stopped after ${ships.length} boxes. Narrow the dates if you need older ones.`); break; }
      } while (cursor);
      ld.done('list');
      pumpContents();
    } catch (err) { if (run === listRun) { say(err.message, true); ld.fail('list', err.message); } }
    finally { if (run === listRun) $('reload').disabled = false; }
  }
  // Contents (what is in each box) only for the boxes currently in view, newest first, 15 per call.
  // Re-entered whenever the view changes; the server caches every box it reads.
  let pumping = false, pumpAgain = false;
  async function pumpContents() {
    if (pumping) { pumpAgain = true; return; }
    pumping = true; const run = contentsRun; const t0 = Date.now(); let read = 0, failed = 0, started = 0;
    try {
      while (run === contentsRun) {
        pumpAgain = false;
        const todo = visible().filter(s => !s.contents && !s.unread).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
        if (!todo.length) break;
        if (!started) started = todo.length + read;
        const total = Math.max(started, todo.length + read);
        const secs = (Date.now() - t0) / 1000, eta = read ? Math.round(secs / read * todo.length) : null;
        ld.set('contents', `${read} of ${total} in view${eta != null ? ` · about ${eta}s left` : ''}${failed ? ` · ${failed} not answered` : ''}`); ld.bar(read / total);
        const batch = todo.slice(0, 15);
        try {
          const j = await call({ action: 'items_bulk', shipments: batch.map(s => ({ id: s.id, updated_at: s.updated_at, status: s.status })) });
          if (run !== contentsRun) return;
          for (const s of batch) { const c = j.contents && j.contents[s.id]; if (c) { s.contents = { orders: c.orders, sku_count: c.sku_count, unit_count: c.unit_count }; read++; } else { s.contents = null; s.unread = true; failed++; } }
        } catch (err) { if (run !== contentsRun) return; failed += batch.length; for (const s of batch) s.unread = true; say('Contents: ' + err.message, true); }
        render();
      }
      if (run === contentsRun) { if (failed) ld.fail('contents', `${failed} boxes not answered by Whatnot, press Refresh to retry`); else ld.done('contents'); ld.bar(null); }
    } finally { pumping = false; if (pumpAgain && run === contentsRun) pumpContents(); }
  }
  // Copy fresh fields from a re-read shipment onto the one we hold.
  function absorb(s, fresh) { if (!s || !fresh || fresh.error) return; for (const k of ['status', 'updated_at', 'has_label', 'tracking', 'carrier', 'service', 'dropoff_due', 'seller_cost_cents', 'required_actions']) s[k] = fresh[k]; }
  const byId = () => new Map(ships.map(s => [s.id, s]));
  // Ask Whatnot to make labels for the picked boxes that have none. Shows the list and asks first: this buys postage.
  let labelsBusy = false;
  async function makeLabels() {
    if (labelsBusy) return;
    const need = pickedShips().filter(s => !s.has_label && s.status === 'created');
    if (!need.length) return;
    const names = need.map(s => s.buyer || s.id);
    const ok = window.confirm(`Ask Whatnot to make ${need.length} label${need.length === 1 ? '' : 's'}? This buys postage.\n\n${names.slice(0, 20).join(', ')}${names.length > 20 ? `, and ${names.length - 20} more` : ''}`);
    if (!ok) return;
    labelsBusy = true; $('makeLabels').disabled = true; say('');
    const map = byId(); let made = 0; const errors = []; let waiting = [];
    try {
      for (let i = 0; i < need.length; i += 25) {
        const batch = need.slice(i, i + 25);
        ld.set('labels', `${i} of ${need.length} asked, waiting for Whatnot`); ld.bar(i / need.length);
        const j = await call({ action: 'generate_labels', shipment_ids: batch.map(s => s.id) });
        for (const s of batch) { const r = j.results && j.results[s.id]; if (!r) continue; absorb(s, r.shipment); if (r.error) errors.push(`${s.buyer || s.id}: ${r.error}`); else if (s.has_label) made++; }
        waiting = waiting.concat(j.still_waiting || []);
        render();
      }
      // Whatnot is still working on some: re-read them every 5 s for up to 2 minutes.
      const t0 = Date.now();
      while (waiting.length && Date.now() - t0 < 120000) {
        ld.set('labels', `${made} of ${need.length} made · waiting on ${waiting.length}`); ld.bar(made / need.length);
        await new Promise(r => setTimeout(r, 5000));
        const j = await call({ action: 'label_status', shipment_ids: waiting });
        const still = [];
        for (const id of waiting) { const s = map.get(id), fresh = j.shipments && j.shipments[id]; absorb(s, fresh); if (s && s.has_label) made++; else still.push(id); }
        waiting = still; render();
      }
      if (waiting.length) errors.push(`${waiting.length} still not made after 2 minutes, press Refresh later`);
      ld.bar(null);
      if (errors.length) { ld.fail('labels', `${made} made, ${errors.length} problem${errors.length === 1 ? '' : 's'}`); say(errors.join(' · '), true); }
      else { ld.done('labels'); say(`${made} label${made === 1 ? '' : 's'} made.`); }
    } catch (err) { ld.bar(null); ld.fail('labels', err.message); say(err.message, true); }
    finally { labelsBusy = false; render(); }
  }
  // One PDF: picked boxes that have a label, earliest day first, fewest different items first inside a day.
  let pdfBusy = false;
  async function buildPdf() {
    if (pdfBusy) return;
    const ps = pickedShips().filter(s => s.has_label);
    if (!ps.length) return;
    if (ps.length > 250) { say(`${ps.length} boxes is more than one PDF can hold (250). Pick fewer.`, true); return; }
    const byDay = new Map(); for (const s of ps) { const k = dayKey(s.created_at); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(s); }
    const ordered = [...byDay.keys()].sort().flatMap(k => byDay.get(k).sort(daySort));
    pdfBusy = true; $('buildPdf').disabled = true; say('');
    ld.set('pdf', `${ordered.length} boxes · fetching each label from Whatnot`);
    try {
      const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': window.CHUKU.key }, body: JSON.stringify({ shop, action: 'build_pdf', shipment_ids: ordered.map(s => s.id) }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('HTTP ' + r.status)); }
      const report = JSON.parse(r.headers.get('x-chuku-report') || '{}');
      const blob = await r.blob();
      const days = [...byDay.keys()].sort();
      const name = `labels-${shop}-${days[0]}${days.length > 1 ? '_to_' + days[days.length - 1] : ''}-${ordered.length}boxes.pdf`;
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      const map = byId();
      const miss = (report.missing || []).map(m => `${(map.get(m.id) || {}).buyer || m.id}: ${m.why}`);
      if (miss.length) { ld.fail('pdf', `${report.boxes} boxes in the file, ${miss.length} left out`); say('Left out: ' + miss.join(' · '), true); }
      else { ld.done('pdf'); say(`PDF downloaded: ${report.boxes} boxes, ${report.pages} pages, as ${name}`); }
    } catch (err) { ld.fail('pdf', err.message); say(err.message, true); }
    finally { pdfBusy = false; renderPrintBar(); }
  }
  async function openLabel(id, btn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = 'Fetching…';
    try {
      const j = await call({ action: 'label', shipment_id: id });
      const url = j.bundled_url || j.label_url;
      if (!url) throw new Error('Whatnot has no document for this shipment yet');
      window.open(url, '_blank', 'noopener');
    } catch (err) { say(err.message, true); }
    finally { btn.disabled = false; btn.textContent = old; }
  }

  async function loadShops() {
    ld.set('shops');
    const { data, error } = await sb.from('shop_keys').select('shop, status, shops(display_name)').is('removed_at', null).order('shop');
    if (error) { say(error.message, true); ld.fail('shops', error.message); return; }
    shops = data || [];
    ld.done('shops');
    $('shop').innerHTML = shops.length ? shops.map(k => `<option value="${esc(k.shop)}">@${esc(k.shop)}${k.shops && k.shops.display_name ? ' (' + esc(k.shops.display_name) + ')' : ''}${k.status !== 'ok' ? ' — key ' + esc(k.status) : ''}</option>`).join('') : '<option value="">No shop keys yet</option>';
    let saved = null; try { saved = localStorage.getItem('chuku.om.shop'); } catch (_) {}
    shop = shops.some(k => k.shop === saved) ? saved : (shops[0] ? shops[0].shop : '');
    $('shop').value = shop;
    if (!shop) { $('days').innerHTML = '<div class="panel empty">Add a shop token on the <a href="/tool/chuku/keys/">Keys</a> page first.</div>'; return; }
    load();
  }

  window.ChukuGate.ready(ctx => { session = ctx.session; $('whoEmail').textContent = ctx.email; sb.auth.onAuthStateChange((_e, s) => { if (s) session = s; }); ld.set('who'); ld.done('who'); loadShops(); });
})();
</script>
